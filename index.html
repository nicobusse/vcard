    <script>
        // ===== نافذة الـ QR =====
        const qrBtn = document.getElementById('qr-btn');
        const qrModal = document.getElementById('qr-modal');
        const qrClose = document.getElementById('qr-close');

        const openQR = () => { qrModal.classList.add('open'); qrModal.setAttribute('aria-hidden', 'false'); };
        const closeQR = () => { qrModal.classList.remove('open'); qrModal.setAttribute('aria-hidden', 'true'); };

        qrBtn.addEventListener('click', openQR);
        qrClose.addEventListener('click', closeQR);
        qrModal.addEventListener('click', (e) => { if (e.target === qrModal) closeQR(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeQR(); });

        // ===== Easter Egg: 5 ضغطات على الصورة =====
        const profileImg = document.getElementById('profile-img');
        const profileVideo = document.getElementById('profile-video');
        const app = document.querySelector('.app-container');
        const panel = document.getElementById('bottom-panel');
        const socialIcons = document.getElementById('social-icons');

        const ICONS_DELAY = 550;   // الجزء اللبني بيستنى الأيقونات تقع الأول

        let tapCount = 0;
        let tapTimer = null;
        let playing = false;
        let videoRequested = false;
        let startedAt = 0;

        profileImg.addEventListener('click', () => {
            if (playing) return;

            // أول ضغطة: نبدأ نحمّل الفيديو في الخلفية (مش بيتحمّل غير لو حد بدأ يدوس)
            if (!videoRequested) {
                videoRequested = true;
                profileVideo.poster = 'intro-poster.jpg';
                profileVideo.preload = 'auto';
                profileVideo.load();
            }

            tapCount++;
            clearTimeout(tapTimer);
            tapTimer = setTimeout(() => { tapCount = 0; }, 1000);

            if (tapCount === 5) {
                tapCount = 0;
                startEgg();
            }
        });

        function startEgg() {
            playing = true;
            startedAt = performance.now();
            closeQR();

            // ١) الأيقونات تقع ورا بعض على طول
            socialIcons.classList.remove('rise');
            socialIcons.classList.add('fall');

            // ٢) الفيديو يشتغل (لازم جوه الضغطة عشان الأيفون يسمح بالصوت)
            profileVideo.currentTime = 0;
            profileVideo.play().catch(endVideo);
        }

        // ٣) الفيديو ميظهرش غير لما أول فريم يتعرض فعلًا – كده مفيش شاشة بيضا
        function revealVideo() {
            if (!playing || app.classList.contains('video-mode')) return;
            const waited = performance.now() - startedAt;
            panel.style.setProperty('--panel-delay', Math.max(0, ICONS_DELAY - waited) + 'ms');
            app.classList.add('video-mode');
        }

        profileVideo.addEventListener('playing', () => {
            if ('requestVideoFrameCallback' in profileVideo) {
                profileVideo.requestVideoFrameCallback(revealVideo);
            } else {
                profileVideo.addEventListener('timeupdate', revealVideo, { once: true });
            }
        });

        // ===== دمج آخر فريم مع الصورة =====
        // اتحسبت بمقارنة آخر فريم بالصورة: بكسل الصورة = 1.5433 × بكسل الفيديو (720p) + إزاحة
        const MATCH = { scale: 1.54328, dx: 15.38, dy: 29.19, videoW: 720 };
        const profileHeader = document.querySelector('.profile-header');

        function mergeTransform() {
            const vw = profileVideo.videoWidth, vh = profileVideo.videoHeight;
            const pw = profileImg.naturalWidth, ph = profileImg.naturalHeight;
            if (!vw || !pw) return null;

            const box = app.getBoundingClientRect();
            const head = profileHeader.getBoundingClientRect();

            // الفيديو: object-fit cover + center top على الشاشة كلها
            const sv = Math.max(box.width / vw, box.height / vh);
            const vx0 = (box.width - vw * sv) / 2;

            // الصورة: object-fit cover + center top في الجزء اللي فوق
            const sp = Math.max(head.width / pw, head.height / ph);
            const px0 = (head.width - pw * sp) / 2;
            const py0 = head.top - box.top;

            const k = MATCH.scale * (MATCH.videoW / vw) * sp / sv;
            const tx = px0 + MATCH.dx * sp - k * vx0;
            const ty = py0 + MATCH.dy * sp;
            return `translate(${tx}px, ${ty}px) scale(${k})`;
        }

        // لما الفيديو يخلص: آخر فريم يتحرك لمكان الصورة بالظبط ويذوب فيها،
        // والجزء اللبني يطلع، وبعده الأيقونات تطلع ورا بعض
        function endVideo() {
            const t = mergeTransform();
            if (t) {
                profileVideo.style.transition =
                    'transform 0.9s cubic-bezier(0.65, 0, 0.35, 1), --f 0.6s ease 0.2s, opacity 0.45s ease 0.5s, visibility 0s linear 0.95s';
                profileVideo.style.transform = t;
                profileVideo.style.setProperty('--f', '9%');
            }
            app.classList.remove('video-mode');
            socialIcons.classList.remove('fall');
            socialIcons.classList.add('rise');

            setTimeout(() => {
                profileVideo.style.transition = 'none';
                profileVideo.style.transform = '';
                profileVideo.style.removeProperty('--f');
                void profileVideo.offsetWidth;
                profileVideo.style.transition = '';
            }, 1000);

            setTimeout(() => {
                socialIcons.classList.remove('rise');
                playing = false;
            }, 1700);
        }

        profileVideo.addEventListener('ended', endVideo);
        profileVideo.addEventListener('error', () => { if (playing) endVideo(); }, true);
    </script>
